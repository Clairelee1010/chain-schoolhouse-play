name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: |
          bun run build --base=/chain-schoolhouse-play/

      - name: Prepare GitHub Pages static site
        shell: bash
        run: |
          set -euo pipefail

          SITE_DIR=".output/public"

          echo "=========================================="
          echo "Preparing Block School Explorer"
          echo "=========================================="

          if [ ! -d "$SITE_DIR" ]; then
            echo "ERROR: $SITE_DIR does not exist."
            exit 1
          fi

          echo "Build output:"
          find "$SITE_DIR" -maxdepth 2 -type f | sort

          if [ -f "$SITE_DIR/index.html" ]; then
            echo "PASS: index.html already exists."

          elif [ -f "$SITE_DIR/_shell.html" ]; then
            echo "Creating index.html from TanStack SPA shell."
            cp "$SITE_DIR/_shell.html" "$SITE_DIR/index.html"

          else
            echo "ERROR: Neither index.html nor _shell.html exists."
            exit 1
          fi

          # GitHub Pages SPA fallback
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"

          # Fix root-relative favicon for project Pages
          sed -i \
            's|href="/favicon.ico"|href="/chain-schoolhouse-play/favicon.ico"|g' \
            "$SITE_DIR/index.html"

          sed -i \
            's|href="/favicon.ico"|href="/chain-schoolhouse-play/favicon.ico"|g' \
            "$SITE_DIR/404.html"

          echo ""
          echo "Checking generated HTML:"
          grep -i "<title" "$SITE_DIR/index.html" || true

          echo ""
          echo "Final artifact:"
          find "$SITE_DIR" -maxdepth 2 -type f | sort

          echo ""
          echo "Static site preparation PASS"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
