name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GitHub Pages 服務於 /<repo-name>/ 子路徑，需覆寫 Vite base
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Prepare static site for GitHub Pages
        # SPA 模式輸出在 dist/client；_shell.html 複製為 index.html 作為進入點，
        # 並將 favicon 改為相對路徑以適應子路徑部署。
        run: |
          cp dist/client/_shell.html dist/client/index.html
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/client/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
