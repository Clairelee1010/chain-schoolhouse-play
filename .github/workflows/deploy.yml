name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: |
          echo "=========================================="
          echo "Building Block School Explorer"
          echo "=========================================="

          bun run build --base=/${{ github.event.repository.name }}/

          echo ""
          echo "Build completed."

      - name: Prepare GitHub Pages artifact
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Detecting static build output"
          echo "=========================================="

          echo ""
          echo "Generated index.html files:"

          INDEX_FILE="$(
            find . \
              -path "./node_modules" -prune -o \
              -path "./.git" -prune -o \
              -type f \
              -name "index.html" \
              -print \
            | grep -E '^\./(dist|\.output|build|out)/' \
            | head -n 1 || true
          )"

          if [ -z "$INDEX_FILE" ]; then
            echo ""
            echo "No generated index.html found."

            echo ""
            echo "Checking for _shell.html..."

            SHELL_FILE="$(
              find . \
                -path "./node_modules" -prune -o \
                -path "./.git" -prune -o \
                -type f \
                -name "_shell.html" \
                -print \
              | grep -E '^\./(dist|\.output|build|out)/' \
              | head -n 1 || true
            )"

            if [ -z "$SHELL_FILE" ]; then
              echo ""
              echo "ERROR: No deployable index.html or _shell.html found."
              echo ""
              echo "Available build files:"
              find dist .output build out \
                -maxdepth 4 \
                -type f \
                2>/dev/null \
                | sort \
                | head -300 || true

              exit 1
            fi

            SITE_DIR="$(dirname "$SHELL_FILE")"

            echo "Found fallback shell:"
            echo "$SHELL_FILE"

            cp "$SHELL_FILE" "$SITE_DIR/index.html"
            INDEX_FILE="$SITE_DIR/index.html"
          fi

          SITE_DIR="$(dirname "$INDEX_FILE")"

          echo ""
          echo "Static entry point:"
          echo "$INDEX_FILE"

          echo ""
          echo "Static site directory:"
          echo "$SITE_DIR"

          # Make favicon compatible with GitHub Pages project subpath.
          if [ -f "$SITE_DIR/index.html" ]; then
            sed -i \
              's|href="/favicon.ico"|href="./favicon.ico"|g' \
              "$SITE_DIR/index.html"
          fi

          # SPA fallback for direct URL / refresh on GitHub Pages.
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"

          echo ""
          echo "Final site files:"
          find "$SITE_DIR" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

          echo ""
          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "Static site preparation: PASS"
          echo "=========================================="

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prepare.outputs.site_dir }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
